# ══════════════════════════════════════════════════════════════════
# Instance 491_C7 — same data as instance_491_C7.yaml, tightened to a 1 % gap.
# Kept as a separate file so the 5 % run in results/491_C7/ is not overwritten
# and the two can be compared side by side.
# ══════════════════════════════════════════════════════════════════
label: 491_C7_gap1
description: 491 paper/cardboard bins, cluster C7 — 1 % optimality gap

paths:
  coordinates: data/raw/coordinates_491_C7_Runa_Sobral_Arruda.xlsx
  attributes:  data/raw/attributes_491_C7_paper.xlsx
  ors_matrix:  data/matrices/distance_matrix_491_C7_Runa_Sobral_Arruda_ORS.xlsx
  instance:    data/instances/instance_491_C7_paper.xlsx
  results:     results/491_C7_gap1

model:
  B: 16              # waste density                     [kg/m3]
  Q: 4000            # vehicle capacity                  [kg]
  R: 0.1625          # revenue per kg collected          [euro/kg]
  C: 1.0             # travel cost                       [euro/km]
  OMEGA: 0.1         # fixed cost per vehicle            [euro]
  MAX_ROUTES: 2      # maximum number of routes (k <= MAX_ROUTES)
  MIP_GAP: 0.01      # solver tolerance                  [0.01 = 1%]
  TIME_LIMIT: 21600  # solver time limit                 [s] (6 h)

lookahead:
  days: 1
  window: 2
  threshold_mg: 100
  threshold_overflow: 100
  near_empty_level_pct: 5

solver:
  knn: 25
  seed: null
  output_flag: 1
  mip_focus: 1
  heuristics: 0.5
  threads: 0
  cuts: 3
  presolve: 1
  node_method: 2
  keep_mustgo_arcs: false
  generate_maps: true

ors:
  transport_mode: driving-hgv
  max_routes_per_request: 3500
  pause_s: 1.6
  manual_block: null
  excel_sheet: 0
  api_key_env: ORS_API_KEY
