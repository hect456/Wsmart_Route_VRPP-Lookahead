# ══════════════════════════════════════════════════════════════════
# Instance 491_C7 — paper/cardboard, cluster C7 (Runa / Sobral / Arruda)
#
# This file is the ONLY parameterisation point. For another instance,
# copy it (config/instance_XXX.yaml), change `label` and `paths`, and run:
#
#   python scripts/01_build_ors_matrix.py  --config config/instance_XXX.yaml
#   python scripts/02_build_instance.py    --config config/instance_XXX.yaml
#   python scripts/03_run_vrpp.py          --config config/instance_XXX.yaml
# ══════════════════════════════════════════════════════════════════
label: 491_C7
description: 491 paper/cardboard bins, cluster C7 (Runa, Sobral de Monte Agraco, Arruda dos Vinhos)

# Paths relative to the project root (or absolute).
paths:
  coordinates: data/raw/coordinates_491_C7_Runa_Sobral_Arruda.xlsx      # ID_bin | Latitude | Longitude
  attributes:  data/raw/attributes_491_C7_paper.xlsx                    # id_contentor | Si | ai | Vol_cont | Vol_kg | Ncont
  ors_matrix:  data/matrices/distance_matrix_491_C7_Runa_Sobral_Arruda_ORS.xlsx
  instance:    data/instances/instance_491_C7_paper.xlsx
  results:     results/491_C7

# ── Model parameters (the most frequently edited ones) ─────────────
model:
  B: 16              # waste density                     [kg/m3]
  Q: 4000            # vehicle capacity                  [kg]
  R: 0.1625          # revenue per kg collected          [euro/kg]
  C: 1.0             # travel cost                       [euro/km]
  OMEGA: 0.1         # fixed cost per vehicle            [euro]
  MAX_ROUTES: 2      # maximum number of routes (k <= MAX_ROUTES)
  MIP_GAP: 0.05      # solver tolerance                  [0.05 = 5%]
  TIME_LIMIT: 21600  # solver time limit                 [s] (6 h)

# ── Classification and horizon ─────────────────────────────────────
lookahead:
  days: 1                    # simulated days
  window: 2                  # lookahead horizon (days)
  threshold_mg: 100          # % : level + ai      >= thr -> MustGo
  threshold_overflow: 100    # % : level + ai*k    >= ovf -> MustGoLA
  near_empty_level_pct: 5    # diagnostics only: almost empty points

# ── Solver / pre-processing ────────────────────────────────────────
solver:
  knn: 25                  # nearest neighbours per node (arc filtering)
  seed: null               # null = Gurobi default seed
  output_flag: 1           # 1 = Gurobi log on screen
  mip_focus: 1
  heuristics: 0.5
  threads: 0               # 0 = all cores
  cuts: 3
  presolve: 1
  node_method: 2           # 2 = barrier at the B&B nodes
  keep_mustgo_arcs: false  # true = never filter out MustGo-MustGo arcs
  generate_maps: true

# ── OpenRouteService (step 1) ──────────────────────────────────────
ors:
  transport_mode: driving-hgv    # driving-hgv | driving-car | cycling-regular | foot-walking
  max_routes_per_request: 3500   # ORS server limit
  pause_s: 1.6                   # pause between requests (free plan: <= 40/min)
  manual_block: null             # null = block size computed automatically
  excel_sheet: 0
  api_key_env: ORS_API_KEY       # name of the env var holding the key
